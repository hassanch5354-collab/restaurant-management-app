<div class="container-fluid">
  
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="text-secondary font-weight-bold">Orders Management</h4>
    
    <!-- Top Action Buttons Header -->
    <div class="d-flex gap-2">
      <!-- Create Order Button (ID: 3) -->
      <a routerLink="/order" 
         class="btn btn-outline-success mr-2"
         [class.disabled]="!authService.canNewOrderView"
         [style.pointer-events]="authService.canNewOrderView ? 'auto' : 'none'">
        <i class="fa fa-plus"></i> + Create Order
      </a>

      <!-- Sales Report Button (ID: 2) -->
      <a routerLink="/sales-report" 
         class="btn btn-primary"
         [class.disabled]="!authService.canSalesReportView"
         [style.pointer-events]="authService.canSalesReportView ? 'auto' : 'none'">
        <i class="fa fa-bar-chart"></i> Sales Report
      </a>
    </div>
  </div>

  <!-- Orders Table -->
  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>Order No</th>
              <th>Customer</th>
              <th>Payment Method</th>
              <th>Grand Total</th>
              <th class="text-center">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of orderList">
              <td>{{ item.OrderNo }}</td>
              <td>{{ item.Customer }}</td>
              <td><span class="badge badge-info">{{ item.PMethod }}</span></td>
              <td class="text-success font-weight-bold">${{ item.GTotal }}</td>
              <td class="text-center">
                <div class="btn-group">
                  
                  <!-- ID: 4 (Edit Order Button) -->
                  <button type="button"
                          class="btn btn-sm btn-info text-white mr-1"
                          [disabled]="!authService.canEditOrderView"
                          (click)="openForEdit(item.OrderID)">
                    <i class="fa fa-pencil"></i> Edit
                  </button>

                  <!-- ID: 5 (Delete Order Button) -->
                  <button type="button"
                          class="btn btn-sm btn-danger text-white"
                          [disabled]="!authService.canDeleteOrderView"
                          (click)="onOrderDelete(item.OrderID)">
                    <i class="fa fa-trash"></i> Delete
                  </button>

                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>
