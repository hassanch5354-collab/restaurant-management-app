<form #form="ngForm" autocomplete="off" (submit)="onSubmit(form)">
  <!-- Order Header Form Fields -->
  <div class="row">
    <div class="col-md-6">
      <div class="form-group">
        <label>Order No.</label>
        <div class="input-group">
          <div class="input-group-prepend">
            <div class="input-group-text">#</div>
          </div>
          <input name="OrderNo" #OrderNo="ngModel" [(ngModel)]="service.formData.OrderNo" class="form-control" readonly>
        </div>
      </div>

      <div class="form-group">
        <label>Customer</label>
        <select name="CustomerID" #CustomerID="ngModel" [(ngModel)]="service.formData.CustomerID" class="form-control" [class.is-invalid]="!isValid && service.formData.CustomerID == 0">
          <option [ngValue]="0">- Select Customer -</option>
          <option *ngFor="let item of customerList" [value]="item.CustomerID">{{item.Name}}</option>
        </select>
      </div>
    </div>

    <div class="col-md-6">
      <div class="form-group">
        <label>Payment Method</label>
        <select name="PMethod" #PMethod="ngModel" [(ngModel)]="service.formData.PMethod" class="form-control">
          <option value="">- Select Payment -</option>
          <option value="Cash">Cash</option>
          <option value="Card">Card</option>
        </select>
      </div>

      <div class="form-group">
        <label>Grand Total</label>
        <div class="input-group">
          <div class="input-group-prepend">
            <div class="input-group-text">$</div>
          </div>
          <input name="GTotal" #GTotal="ngModel" [(ngModel)]="service.formData.GTotal" class="form-control" readonly>
        </div>
      </div>
    </div>
  </div>

  <!-- Items Table -->
  <div class="table-responsive mt-3">
    <table class="table table-borderless table-hover">
      <thead class="thead-light">
        <tr>
          <th>Food Item</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total</th>
          <th class="text-right" style="min-width: 250px;">
            <div class="d-flex justify-content-end align-items-center" style="gap: 8px;">
              <a class="btn btn-sm btn-success text-white" (click)="AddOrEditOrderItem(null, service.formData.OrderID)">
                <i class="fa fa-plus"></i> Add Item
              </a>
              <button type="submit" class="btn btn-sm btn-dark" [disabled]="isSaving">
                <i class="fa fa-database"></i> {{ isSaving ? 'Saving...' : 'Submit' }}
              </button>
            </div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="!service.orderItems || service.orderItems.length == 0">
          <td class="font-italic text-center text-muted" colspan="5">
            No food item selected for this order.
          </td>
        </tr>

        <tr *ngFor="let item of service.orderItems; let i = index;">
          <td class="font-weight-bold">{{ item.ItemName || item.Name || 'Food Item' }}</td>
          <td>${{ (item.Price || 0) | number:'1.2-2' }}</td>
          <td>{{ item.Quantity }}</td>
          <td>${{ (item.Total || (item.Quantity * item.Price) || 0) | number:'1.2-2' }}</td>
          <td class="text-right">
            <a class="btn btn-sm btn-info text-white mr-1" (click)="AddOrEditOrderItem(i, service.formData.OrderID)">
              <i class="fa fa-pencil"></i>
            </a>
            <a class="btn btn-sm btn-danger text-white" (click)="onDeleteOrderItem(item.OrderItemID, i)">
              <i class="fa fa-trash"></i>
            </a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</form>
