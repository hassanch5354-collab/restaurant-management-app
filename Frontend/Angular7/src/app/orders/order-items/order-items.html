<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card shadow border-0 rounded-3">
        <div class="card-header bg-white border-bottom py-3">
          <h4 class="mb-0 font-weight-bold text-secondary">Order Food Item</h4>
        </div>
        <div class="card-body p-4">
          <form #form="ngForm" autocomplete="off" (submit)="onSubmit(form)">
            <input type="hidden" name="OrderItemID" [value]="formData.OrderItemID">
            <input type="hidden" name="OrderID" [value]="formData.OrderID">
            <input type="hidden" name="ItemName" [value]="formData.ItemName">

            <div class="form-group mb-3">
              <label class="form-label font-weight-semibold">Food Item</label>
              <select name="ItemID" #ItemID="ngModel" [(ngModel)]="formData.ItemID" class="form-control" (change)="updatePrice($event.target)">
                <option value="0">- Select Food Item -</option>
                <option *ngFor="let item of itemList" [value]="item.ItemID">{{item.Name}}</option>
              </select>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label font-weight-semibold">Price</label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text">$</span>
                  </div>
                  <input name="Price" #Price="ngModel" [(ngModel)]="formData.Price" class="form-control" readonly>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label font-weight-semibold">Quantity</label>
                <input type="number" name="Quantity" #Quantity="ngModel" [(ngModel)]="formData.Quantity" class="form-control" (keyup)="updateTotal()" (change)="updateTotal()" min="1">
              </div>
            </div>

            <div class="form-group mb-4">
              <label class="form-label font-weight-semibold">Total</label>
              <div class="input-group">
                <div class="input-group-prepend">
                  <span class="input-group-text">$</span>
                </div>
                <input name="Total" #Total="ngModel" [(ngModel)]="formData.Total" class="form-control" readonly>
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-dark mr-2">
                <i class="fa fa-database"></i> Submit
              </button>
              <button type="button" class="btn btn-outline-secondary" (click)="onClose()">
                <i class="fa fa-close"></i> Close
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
