<div class="container-fluid py-4 dashboard-container">
    <!-- Top Bar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="font-weight-bold text-dark mb-1">Restaurant Analytics Dashboard</h3>
            <p class="text-muted small mb-0">Visual analysis via Pie & Donut distribution charts</p>
        </div>
        <button class="btn btn-outline-success btn-sm px-3" (click)="fetchDashboardData()">
            <i class="fa fa-refresh mr-1"></i> Refresh Data
        </button>
    </div>
    <!-- KPI Summary Cards -->
    <div class="row mb-4">
        <!-- Total Revenue -->
        <div class="col-md-3 col-sm-6 mb-3">
            <div class="card stat-card shadow-sm border-left-primary h-100">
                <div class="card-body">
                    <div class="text-xs font-weight-bold text-success text-uppercase mb-1">Total Revenue</div>
                    <div class="h4 mb-0 font-weight-bold text-dark">Rs. {{ totalRevenue | number:'1.2-2' }}</div>
                </div>
            </div>
        </div>
        <!-- Total Orders -->
        <div class="col-md-3 col-sm-6 mb-3">
            <div class="card stat-card shadow-sm border-left-success h-100">
                <div class="card-body">
                    <div class="text-xs font-weight-bold text-success text-uppercase mb-1">Total Orders</div>
                    <div class="h4 mb-0 font-weight-bold text-dark">{{ totalOrdersCount }}</div>
                </div>
            </div>
        </div>
        <!-- Cash Orders -->
        <div class="col-md-3 col-sm-6 mb-3">
            <div class="card stat-card shadow-sm border-left-info h-100">
                <div class="card-body">
                    <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">Cash Orders</div>
                    <div class="h4 mb-0 font-weight-bold text-dark">{{ cashOrdersCount }}</div>
                </div>
            </div>
        </div>
        <!-- Card Orders -->
        <div class="col-md-3 col-sm-6 mb-3">
            <div class="card stat-card shadow-sm border-left-warning h-100">
                <div class="card-body">
                    <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">Card Orders</div>
                    <div class="h4 mb-0 font-weight-bold text-dark">{{ cardOrdersCount }}</div>
                </div>
            </div>
        </div>
    </div>
    <!-- Pie & Donut Charts Grid -->
    <div class="row">
        <!-- Chart 1: Donut Chart (Payment Method) -->
        <div class="col-lg-4 col-md-6 mb-4">
            <div class="card stat-card shadow-sm h-100">
                <div class="card-header bg-white py-3 border-bottom">
                    <h6 class="m-0 font-weight-bold text-dark">Payment Mode</h6>
                </div>
                <div class="card-body d-flex align-items-center justify-content-center">
                    <div class="chart-box">
                        <canvas #paymentDonutCanvas></canvas>
                    </div>
                </div>
            </div>
        </div>
        <!-- Chart 2: Pie Chart (Top Selling Food Share) -->
        <div class="col-lg-4 col-md-6 mb-4">
            <div class="card stat-card shadow-sm h-100">
                <div class="card-header bg-white py-3 border-bottom">
                    <h6 class="m-0 font-weight-bold text-dark">Menu Item Sales</h6>
                </div>
                <div class="card-body d-flex align-items-center justify-content-center">
                    <div class="chart-box">
                        <canvas #topItemsPieCanvas></canvas>
                    </div>
                </div>
            </div>
        </div>
        <!-- Chart 3: Donut Chart (Revenue Share by Order Value) -->
        <div class="col-lg-4 col-md-12 mb-4">
            <div class="card stat-card shadow-sm h-100">
                <div class="card-header bg-white py-3 border-bottom">
                    <h6 class="m-0 font-weight-bold text-dark">Order Value Split</h6>
                </div>
                <div class="card-body d-flex align-items-center justify-content-center">
                    <div class="chart-box">
                        <canvas #revenueSplitDonutCanvas></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
