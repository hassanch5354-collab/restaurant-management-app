<div class="chatbot-toggler" (click)="toggleChat()">
  <i class="fa" [ngClass]="isOpen ? 'fa-times' : 'fa-comments'"></i>
</div>

<!-- Floating Chat Window -->
<div class="chatbot-window card shadow-lg" *ngIf="isOpen">
  <!-- Header -->
  <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-2 px-3">
    <span class="font-weight-bold">Restaurant AI Bot</span>
    <button class="btn btn-sm text-white close-btn" (click)="toggleChat()">&times;</button>
  </div>
  <!-- Chat History -->
  <div class="card-body chat-body" #chatScroll>
    <div *ngFor="let msg of messages" [ngClass]="msg.sender === 'bot' ? 'msg-bot-wrapper' : 'msg-user-wrapper'">
      <div class="msg-bubble" [ngClass]="msg.sender === 'bot' ? 'msg-bot' : 'msg-user'">
        <p class="mb-1 message-text">{{ msg.text }}</p>
        <span class="msg-time">{{ msg.time }}</span>
      </div>
    </div>
  </div>
  <!-- Input Footer -->
  <div class="card-footer bg-light p-2">
    <div class="input-group">
      <input type="text" class="form-control form-control-sm" 
             placeholder="Type your message here..." 
             [(ngModel)]="userMessage" 
             (keyup.enter)="sendMessage()">
      <div class="input-group-append">
        <button class="btn btn-primary btn-sm" (click)="sendMessage()">
          <i class="fa fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>
</div>
